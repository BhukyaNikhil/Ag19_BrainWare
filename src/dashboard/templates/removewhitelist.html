<!DOCTYPE html>
<html>
<head>
    <title>Remove Whitelist IP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #111827 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        /* Center box */
        .box {
            width: 420px;
            padding: 26px;
            border: 2px solid #22c55e;
            border-radius: 14px;
            background-color: white;
            text-align: center;
            box-shadow: 0 10px 24px rgba(0,0,0,0.20);
            animation: fadeIn 0.35s ease;
        }

        h2 {
            color: #16a34a;
            margin-bottom: 18px;
            letter-spacing: 0.3px;
            font-weight: 800;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 11px;
            font-size: 14px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        input:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 4px rgba(34,197,94,0.18);
        }

        button {
            padding: 10px 16px;
            background: linear-gradient(135deg, #16a34a, #15803d);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            color: white;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 18px rgba(34,197,94,0.28);
        }

        button:hover {
            transform: translateY(-1px) scale(1.02);
            box-shadow: 0 10px 22px rgba(34,197,94,0.35);
        }

        .back-button {
            margin-top: 15px;
            padding: 8px 12px;
            background-color: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            color: #374151;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .back-button:hover {
            background-color: #e5e7eb;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .ambient::before { content: ""; position: absolute; width: 520px; height: 520px; background: radial-gradient(closest-side, rgba(34,197,94,0.25), transparent 70%); filter: blur(60px); top: -80px; left: -120px; border-radius: 50%; animation: float1 12s ease-in-out infinite; }
        .ambient::after { content: ""; position: absolute; width: 520px; height: 520px; background: radial-gradient(closest-side, rgba(22,163,74,0.25), transparent 70%); filter: blur(60px); bottom: -120px; right: -180px; border-radius: 50%; animation: float2 16s ease-in-out infinite; }
        @keyframes float1 { 0% { transform: translate(0,0); } 50% { transform: translate(30px, 20px); } 100% { transform: translate(0,0); } }
        @keyframes float2 { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(-30px, -25px) rotate(6deg); } 100% { transform: translate(0,0) rotate(0deg); } }
        @media (max-width: 768px) {
            .box { width: 92%; padding: 20px; }
            .input-row { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>

<body>
<div class="ambient"></div>
<div class="box">
    <h2>➖ Remove Whitelist IP</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div style="color: {% if category == 'success' %}green{% else %}red{% endif %}; margin-bottom: 10px;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="input-row">
            <input type="text" name="ip" placeholder="Enter IP Address or Plant Name to remove" required>
            <button type="submit">Remove</button>
        </div>
    </form>

    <button class="back-button" onclick="window.location.href='/admin/dashboard'">⬅ Back to Dashboard</button>
</div>

</body>
</html>
